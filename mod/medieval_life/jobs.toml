# Work sites of the new character. This is the only file to edit.
#
# tools/generate_jobs.py turns it into the script data, the role that opens the option in the
# dialog of each NPC, and the texts in English and Spanish. tools/install_mod.py runs it.
# It checks every NPC and skill against the tables of the game, and stops if one does not exist.
#
#   key      Short id, in lower case. ml_goto <key> goes to the NPC, as a test shortcut.
#   npcs     soul_name of each NPC who gives this work. The tables do not say who runs each
#            shop, so these come from their faction and trade, and the game has the last word.
#   name_en, name_es  Text of the clock.
#   place_en, place_es  How the book of trades writes the place.
#   main     Skill or stat that gets the most experience. secondary gets the rest.
#   steady   true if this site also offers the steady job.
#   bed      x, y, z and yaw of the bed of the employee, from ml_pos. Optional.
#   requires Only while Henry's story has this place in the world: castle, semine or semine_manor (story.lua). Optional.
#   hours    First and last hour of work here, when the NPC keeps other hours than first_hour and last_hour. Optional.
#            The game gives each NPC a routine (Libs/Tables/ai/SchedulerAlias.xml, linked from the NPC in the level):
#            most work 7 to 19, give or take half an hour, so the day of the mod, 8 to 18, fits inside it.

wage = 1.8           # Groschen per hour.
xp_main = 6          # Experience per hour.
xp_secondary = 2
first_hour = 8       # The day starts here.
last_hour = 18       # And ends here: the hours on offer are what is left of it.
min_hours = 2        # With less than this left, the NPC says to come back tomorrow.
role_en = "Hired hand"  # The post, as the book of trades writes it.
role_es = "Ayudante"

# Steady job. The shift is the most that fits in the day, and the dialog says how long it is.
steady_wage = 0.8               # Groschen per hour.
steady_work_days = 6            # Counted from the day of hiring, then the days off.
steady_days_off = 1
steady_min_hours = 6            # With less than this left in the day, the shift is lost.
steady_hire_last_hour = 12      # From this hour on, employers say to come back tomorrow.
steady_late_minutes = 30        # Starting later than this past first_hour is late. Two working days in a row is a fault.
steady_faults = 3               # This many active faults is a dismissal.
steady_fault_days = 14          # A fault stops counting after this.
steady_rehire_quit_days = 3     # Days to ask again after quitting.
steady_rehire_fired_days = 7    # And after a dismissal, also for leaving the region.
casual_min_reputation = 35      # Points of the reputation panel, with the faction of the employer. Below this, no casual work.
steady_min_reputation = 50      # And below this, no steady job.
steady_area = 5                 # Metres around the bed where the employee may be, private or not.
# What a shift gives to eat, by item name. Together they feed as much as a bread: 19.
steady_meal = ["breadroll", "water", "plums", "parsnip", "egg"]
# A day of work of at least casual_meal_min_hours gives a poorer meal: less food, and not fresh.
casual_meal = ["pretzel", "water", "peaches", "leek", "egg"]
casual_meal_min_hours = 6
casual_meal_health = 0.6
casual_meal_fresh = ["water"]   # These stay as they are.
steady_role_en = "Steady hand"
steady_role_es = "Ayudante fijo"

# A bed for the night, at the places that rent one in the game: rent is the SmartObjectHolder of that rental in
# the level, rent_price its price in groschen, as the game asks. tools/generate_jobs.py takes the bed, its prompt and
# the door from the level. The bed is the character's until rent_until_hour of the next morning.
rent_until_hour = 10
# Or for a week: this many nights, for the price of these.
rent_week_days = 7
rent_week_paid_nights = 5

