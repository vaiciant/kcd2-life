# Orders of the businesses (F6).
# tools/generate_orders.py writes from this file the journal quests, the dialog, the tokens, the texts and
# Scripts/MedievalLife/orders_data.lua. tools/install_mod.py runs it before packing.
#
# Every business draws a day from 1 to days_between, each on its own, and asks on that day, that day + 7,
# + 14... of the life, so two businesses can ask the same day. The draw comes from the day the life
# started, so Lua makes it again the same anywhere. The order lasts that day only. The keys are those
# of jobs.toml.
#
# A business has two turns, each on its own day. In one it sends something of its own to each of the
# others, in its town and in the other one. In the other it needs something: half the weeks it is
# fetched from another business, and half it is bought, with money that the business gives. The texts come
# from templates in the generator, with the names of the people as the game writes them, and do not say which
# goods go, except the objective to buy. Lua picks the order of the day, and when it is taken, which goods
# and how many.

days_between = 7
deadline_hours = 12
# Hours of the working day of the place the errand ends at: the clock stops while it is closed.
fail_points = 10          # Points of the panel that the business loses when an order runs out.
done_points = 1           # And that it gains when it is done.
pay_same_town = 1.5       # Groschen for an order inside one town: less than an hour of casual work.
pay_other_town = 10       # And from one town to the other: the road is long and can be dangerous.
fetch_pay_factor = 1.5    # A pickup pays this many times as much: the character goes there and comes back. To the
                          # nearest tenth of a groschen: 2.3 in the same town, 15 to the next one.
buy_percent = 100         # The money to buy: what a shop asks with 50 points of reputation, in percent of what the goods
                          # are worth (shops sell at 0.7 to 0.8, and 50 points add a quarter). pay_same_town is
                          # added on top, so what is left is the pay.
# Trust of each business: pickups need this many deliveries done for it, and buying, this many
# deliveries and pickups together. Each of its orders that runs out multiplies both by trust_factor.
trust_fetch = 5
trust_buy = 15
trust_factor = 2
# Or the hours worked for the business: this many as its steady employee opens pickups, and this many
# shopping. A casual hour counts for half, so casual work takes twice as many. Each order run out multiplies them
# by trust_factor too.
work_fetch_hours = 50
work_buy_hours = 80
casual_hours_weight = 0.5
# Errands keep the working hours of each business, as its work does (jobs.toml): it gives them and takes them
# in only then, and gives none in the last late_margin_hours before the place the character must go closes.
late_margin_hours = 1
# Points of the reputation panel with the business that each kind needs.
rep_deliver = 40
rep_fetch = 50
rep_buy = 65
# This many errands run out and unpaid in a town, and their slips pass to the guard as a theft: what is
# owed, in IOUs, plus the 50 groschen of a theft. The guard hears it when the character is in the
# town, within crime_range metres of one of its authorities, because the guards of a town far away do not
# take it.
crime_fails = 3
crime_range = 150

